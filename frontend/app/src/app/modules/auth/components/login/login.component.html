<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" style="width:100%; margin-top:16px;">
          <mat-label>User ID</mat-label>
          <input matInput formControlName="userId" placeholder="Enter your user ID">
          <mat-error *ngIf="userIdControl?.hasError('required')">User ID is required</mat-error>
          <mat-error *ngIf="userIdControl?.hasError('minlength')">Minimum 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="passwordControl?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="passwordControl?.hasError('minlength')">Minimum 6 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="user">General User</mat-option>
            <mat-option value="admin">Admin</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
          style="width:100%; height:48px; font-size:16px; margin-top:8px;"
          [disabled]="isLoading">
          <mat-progress-spinner *ngIf="isLoading" diameter="20"
            mode="indeterminate" style="display:inline-block; margin-right:8px;">
          </mat-progress-spinner>
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-footer>
      <div style="text-align:center; padding:12px; color:#666; font-size:13px;">
        Demo: admin01 / admin123 / Admin role
      </div>
    </mat-card-footer>

  </mat-card>
</div>
